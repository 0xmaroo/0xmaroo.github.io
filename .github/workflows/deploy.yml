# Deploy to GitHub Pages
#
# Repo must be named `0xmaroo.github.io` (user page) so the site serves from
# the repo root with `base: '/'`. Otherwise the `base` in astro.config.mjs
# (and the CNAME) have to change.
#
# `npm run build` runs `astro build && pagefind --site dist` in one command —
# Pagefind runs BEFORE the artifact upload, so the search index ships.
#
# All actions are pinned to full commit SHAs (no floating tags). The pinned
# versions are reviewed on the quarterly maintenance pass (plan/05-roadmap.md
# Phase 6) and in the pre-deploy checklist (plan/08-quality-bar.md §8.6).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (src/lib)
        # The visibility gate, the language switch and the proof layer are
        # tested before anything is built — a regression never deploys.
        run: npm test
      - name: Build (Astro + Pagefind)
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # v4+ drops dotfiles by default — that would silently remove
          # /.well-known/security.txt (plan/08 §8.2) from the live site.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
