# Deploy to GitHub Pages
#
# Repo must be named `0xmaroo.github.io` (user page) so the site serves from
# the repo root with `base: '/'`. Otherwise the `base` in astro.config.mjs
# (and the CNAME) have to change.
#
# `npm run build` runs `astro build && pagefind --site dist` in one command —
# Pagefind runs BEFORE the artifact upload, so the search index ships.
#
# All actions are pinned to full commit SHAs (no floating tags). The pinned
# versions are reviewed on the quarterly maintenance pass (plan/05-roadmap.md
# Phase 6) and in the pre-deploy checklist (plan/08-quality-bar.md §8.6).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (Astro + Pagefind)
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
